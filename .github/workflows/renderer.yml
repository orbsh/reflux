name: renderer

# The renderer bundle is a build product of another repository (fluxen's
# `examples/renderer`), so it is not committed here: every push to main builds the
# revision `vendor/pin.json` names and attaches the result to a release of this
# repository, tagged `renderer-<rev>`. No button.
#
# Idempotent by construction, which is what makes "always" safe:
#
#   * a push whose pin is already published does not build — it installs the release
#     and runs the tests that read `versions.json`, so the twenty commits that merely
#     touch the producer cost twenty cheap jobs and zero wasm builds;
#   * a push that moves the pin publishes, because that tag cannot exist yet: the tag
#     *is* the revision.
#
# Bumping the renderer is therefore a one-line commit (`rev`/`tag`/`asset` in
# `vendor/pin.json`) and CI does the rest. "Publish first, then bump" stops being a
# rule anyone must remember — it is what the trigger enforces.
#
# The browser gates are not here: they drive a real Chromium over CDP, and CI is not
# the place to argue about a headless browser's fonts.

on:
  push:
    branches: [main]
  pull_request:
    paths: ["vendor/**", "tools/vendor.py", "www/**", ".github/workflows/renderer.yml"]

env:
  # The version development uses; fluxen's own ui-release pins the same one.
  TRUNK_VERSION: "0.21.14"
  FLUXEN_REPO: orbsh/fluxen

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned bundle
        run: python3 tools/vendor.py fetch
      - name: Tests that read the manifest
        run: |
          python3 -m unittest discover -s tests -t .
          python3 tools/gen_sdk.py --check

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: What the pin asks for, and whether it is already published
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev="$(python3 -c 'import json;print(json.load(open("vendor/pin.json"))["rev"])')"
          tag="$(python3 -c 'import json;print(json.load(open("vendor/pin.json"))["tag"])')"
          # The pin keeps a short rev because that is what a human reads. checkout needs the
          # full object id: it fetches *refs*, so `5ec9b4d` asks for a branch or tag of that
          # name and dies — the abbreviated sha only means something once the object is here.
          full="$(gh api "repos/${FLUXEN_REPO}/commits/${rev}" --jq .sha)"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "\`$tag\` is already published: this run installs and verifies it, and builds nothing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "\`$tag\` is not published yet: this run builds it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Already published — prove the pin still installs, then stop
        if: steps.pin.outputs.exists == 'true'
        run: |
          python3 tools/vendor.py fetch
          python3 -m unittest discover -s tests -t .
          python3 tools/gen_sdk.py --check

      - uses: actions/checkout@v4
        if: steps.pin.outputs.exists == 'false'
        with:
          # A public repository, cloned read-only: the default token is enough, so no
          # cross-repository secret has to exist for this workflow to work. Make fluxen
          # private and this needs a PAT in secrets instead.
          repository: ${{ env.FLUXEN_REPO }}
          ref: ${{ steps.pin.outputs.full }}
          path: .fluxen

      - uses: dtolnay/rust-toolchain@stable
        if: steps.pin.outputs.exists == 'false'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.pin.outputs.exists == 'false'
        with:
          workspaces: .fluxen

      - name: Install trunk
        if: steps.pin.outputs.exists == 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@${{ env.TRUNK_VERSION }}

      - name: Build the renderer and assemble the release
        if: steps.pin.outputs.exists == 'false'
        env:
          TAG: ${{ steps.pin.outputs.tag }}
          REV: ${{ steps.pin.outputs.rev }}
        run: |
          trunk --version
          python3 tools/vendor.py build --fluxen .fluxen --rev "$REV" --tag "$TAG"

      - name: Keep the manifest in the summary
        if: steps.pin.outputs.exists == 'false'
        run: |
          {
            echo '```json'
            cat www/static/vendor/fluxen/versions.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v2
        if: steps.pin.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.pin.outputs.tag }}
          name: renderer ${{ steps.pin.outputs.rev }}
          draft: false
          body: |
            The fluxen renderer bundle, built from `${{ env.FLUXEN_REPO }}@${{ steps.pin.outputs.rev }}`
            with `trunk build --release`, installed into this host's layout by `tools/vendor.py build`.

            `python3 tools/vendor.py fetch` installs it; that is what `vendor/pin.json` points at while
            it names this tag. The tarball carries `versions.json` (rev, entry names, per-file sha256)
            and the four files a page loads; module media (monaco, mermaid, 3d-force-graph, …) is not
            in it, because frames that name those fetch them.
          files: |
            dist-release/*.tar.gz
            dist-release/SHA256SUMS