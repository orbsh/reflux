<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reflux</title>
  <!-- 资源一律从源站绝对路径取（`/static/…`）：页面挂在哪条前缀下都不影响它们，深链也不会
       把引用解析到深链目录底下。js/wasm 的名字带内容哈希，所以从 versions.json 取，不写死。
       `<base>` 是客户端 runtime 的挂载前缀（标记写应用路径，地址栏写挂载后的路径）。 -->
  <base href="/__next/">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/vendor/fluxen/assets/main.css">
  <link rel="stylesheet" href="/static/reflux.css">
</head>
<body>
  <div id="main" data-codec="json" data-path="/ws"></div>
  <script type="module">
    const versions = await (await fetch("/static/vendor/fluxen/versions.json")).json();
    const entry = "/static/vendor/fluxen/" + versions.entry.js;
    const { default: init } = await import(entry);
    await init({ module_or_path: "/static/vendor/fluxen/" + versions.entry.wasm });
    // 渲染器起来了，再交班给 runtime：它只会调 window.fluxen.send
    const { start } = await import("/static/reflux.js");
    start();
  </script>
</body>
</html>
