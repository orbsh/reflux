[project]
name = "reflux"
version = "0.0.0"
description = "A spec plus a static shell: write frontend UI in any language"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # The generated SDK's type layer (reflux/sdk/types.py) is pydantic models: the type layer is an
    # off-the-shelf JSON-Schema consumer's output, not something we hand-write (see docs/DESIGN.md
    # 「生产者」). Only the SDK needs it.
    "pydantic>=2",
    # The transport (ADR 0002): HTTP, the WebSocket handshake, and the outbound client a handler
    # awaits. One dependency replaces a hand-written codec and an `http.server` special case.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# A backend is the deployment's choice, so none of them is a dependency of the library: `memory` (the
# default) and `sqlite` (the standard library) are always there, and a store you name must be installed
# by the deployment that names it. `stores.make_store` says which package is missing.
redis = ["redis>=5"]
fjall = ["pyfjall>=0.1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# The page tree stays at the repository root (`www/`) while the wheel carries it as `reflux/www/` —
# `hatch_build.py` fetches the pinned renderer loom and copies the tree in, so an installed reflux
# serves pages without a network request and without the vendored wasm living in git.
[tool.hatch.build.targets.wheel]
packages = ["reflux"]

[tool.hatch.build.targets.wheel.hooks.custom]

# An sdist without `www/` and `tools/vendor.py` could not build a wheel: the page tree is what the
# wheel serves and the fetch script is what puts a renderer bundle inside it (the newest release, since
# reflux does not pin one).
[tool.hatch.build.targets.sdist]
include = [
    "/reflux",
    "/www",
    "/tools/vendor.py",
    "/hatch_build.py",
    "/pyproject.toml",
    "/README.md",
]